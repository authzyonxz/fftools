<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFPatch · Catálogo</title>
<base href="./">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>FFPatch <small>catálogo de funções</small></h1>
  </div>
  <div class="topbar-actions">
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
    <button id="save-token" class="btn">entrar</button>
  </div>
</header>

<main>
  <section class="panel" id="login-panel">
    <h2>acesso</h2>
    <p class="muted">Informe o <code>ADMIN_TOKEN</code> configurado no servidor. Ele fica salvo só neste navegador.</p>
  </section>

  <section class="panel hidden" id="catalog-panel">
    <h2>catálogo publicado</h2>
    <div class="row">
      <input id="catalog-url" type="text" readonly>
      <button id="copy-catalog" class="btn">copiar</button>
      <a id="open-catalog" class="btn ghost" target="_blank" rel="noreferrer">abrir</a>
    </div>
    <p class="muted">É essa URL que vai no <code>Catalog.plist</code> do app (obfuscada). Versão do catálogo: <span id="catalog-version">—</span></p>
  </section>

  <section class="panel hidden" id="games-panel">
    <h2>jogos</h2>
    <div id="games-editor" class="games-editor"></div>
    <button id="save-games" class="btn">salvar jogos</button>
  </section>

  <section class="panel hidden" id="functions-panel">
    <div class="row between">
      <h2>funções</h2>
      <button id="new-function" class="btn">+ nova função</button>
    </div>
    <div id="functions"></div>
  </section>

  <section class="panel hidden" id="audit-panel">
    <h2>auditoria</h2>
    <ul id="audit" class="audit"></ul>
  </section>
</main>

<template id="function-template">
  <article class="function">
    <header class="function-head">
      <div class="function-id" data-field="id"></div>
      <input class="input name" data-field="name" placeholder="nome exibido">
      <select class="input group" data-field="groupId"></select>
      <select class="input status" data-field="status">
        <option value="active">ativo</option>
        <option value="maintenance">manutenção</option>
        <option value="disabled">desativado</option>
      </select>
    </header>

    <div class="grid">
      <label class="field">
        <span>subtítulo</span>
        <input class="input" data-field="subtitle" placeholder="texto abaixo do nome">
      </label>
      <div class="field">
        <span>jogos</span>
        <div class="games" data-field="games"></div>
      </div>
      <label class="field">
        <span>locate.mode</span>
        <select class="input" data-field="locateMode">
          <option value="path-or-name">path-or-name</option>
          <option value="path">path</option>
          <option value="name">name</option>
        </select>
      </label>
      <label class="field">
        <span>locate.names (vírgula)</span>
        <input class="input" data-field="locateNames" placeholder="global-metadata.dat">
      </label>
      <label class="field">
        <span>locate.roots (vírgula)</span>
        <input class="input" data-field="locateRoots" placeholder="Documents,Library">
      </label>
      <label class="field">
        <span>maxMatches</span>
        <input class="input" data-field="maxMatches" type="number" min="1" max="64" value="8">
      </label>
    </div>

    <div class="publish" data-field="publish"></div>

    <footer class="function-actions">
      <button class="btn" data-action="save">salvar</button>
      <button class="btn danger" data-action="delete">excluir função</button>
    </footer>
  </article>
</template>

<script src="admin.js"></script>
</body>
</html>
