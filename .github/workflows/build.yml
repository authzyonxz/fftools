name: build-ipa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Configure remote catalog
        env:
          CATALOG_BASE_URL: https://keyauthv2.org/3106
          MASTER_SECRET: ${{ secrets.MASTER_SECRET }}
        run: |
          set -eu
          test -n "$MASTER_SECRET" || { echo "Missing repository secret MASTER_SECRET" >&2; exit 1; }
          python3 Scripts/protect_config.py --url "$CATALOG_BASE_URL" --secret-env MASTER_SECRET
          python3 - <<'PY'
          import base64
          import os
          import plistlib
          from pathlib import Path
          key = 0x5B
          def unmask(value):
              data = base64.b64decode(value)
              return bytes(byte ^ key ^ ((index * 31) & 0xFF) for index, byte in enumerate(data)).decode()
          plist = plistlib.loads(Path("Resources/Catalog.plist").read_bytes())
          assert unmask(plist["baseURLMasked"]) == os.environ["CATALOG_BASE_URL"].rstrip("/")
          assert unmask(plist["masterSecretMasked"]) == os.environ["MASTER_SECRET"]
          print("Catalog URL and secret match; both remain masked in the plist.")
          PY

      - name: Build unsigned IPA
        env:
          LOGOS_API_TOKEN: ${{ secrets.LOGOS_API_TOKEN }}
        run: |
          chmod +x Scripts/build_ipa.sh
          echo "bab76fe5082e60488fa1f6ecde04f2e505feac322e0bd0e6c1bec325426d3b5a  Sources/Vendor/LogosAPI/libAPIClient.a" | shasum -a 256 --check
          ./Scripts/build_ipa.sh

      - name: Verify bundle layout and unsigned state
        run: |
          set -e
          APP="build/Payload/External iOS.app"
          test -x "$APP/External"
          test -f "$APP/Frameworks/ffpatch.dylib"
          test -f "$APP/Info.plist"
          test -f "$APP/Catalog.plist"
          test -f "$APP/APIAuth.plist"
          ! find "$APP" -type f -name '*.a' -print -quit | grep -q .
          test ! -d "$APP/_CodeSignature"
          test ! -f "$APP/embedded.mobileprovision"
          if ! nm -m "$APP/Frameworks/ffpatch.dylib" | awk '$NF == "_FFAppMain" && $(NF-1) == "external" && $(NF-2) != "private" { found=1 } END { exit !found }'; then
            echo "FFAppMain não está exportado para o launcher (dlsym)." >&2
            exit 1
          fi
          echo "FFAppMain exportado para dlsym: OK"
          for symbol in _apiclient_set_token _apiclient_set_language _apiclient_paid _apiclient_get_package_name _apiclient_get_expired_at _apiclient_get_expired_at_local; do
            if ! nm -g "$APP/Frameworks/ffpatch.dylib" | grep -Fq "$symbol"; then
              echo "API completa não ligada dentro da dylib: falta $symbol" >&2
              exit 1
            fi
          done
          if otool -L "$APP/Frameworks/ffpatch.dylib" | grep -qi 'APIClient'; then
            echo "A API deveria estar ligada estaticamente, sem dependência de dylib separada" >&2
            exit 1
          fi
          echo "API completa ligada estaticamente; nenhum .a no bundle: OK"
          echo "IPA is unsigned and contains its masked catalog configuration."
          echo "--- linked images ---"
          otool -L "$APP/Frameworks/ffpatch.dylib"
          echo "--- architectures ---"
          lipo -info "$APP/External" "$APP/Frameworks/ffpatch.dylib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: External-iOS-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 1
